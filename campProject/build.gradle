plugins {
	id 'java'
	id 'eclipse'
	id 'war'
	id 'org.springframework.boot' version '3.1.12'  // oracle 11g & JPA 활용을 위해 구버전 사용
	id 'io.spring.dependency-management' version '1.1.6'
}

group = 'com.javateam'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
	
	// 자체 로깅 시스템(logback) 제거 --> log4j2 대체
	all {
		// exclude group : 'org.springframework.boot', module: 'spring-boot-starter-logging'
		exclude module: 'spring-boot-starter-logging'
		}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:3.0.3'
	implementation 'org.thymeleaf.extras:thymeleaf-extras-springsecurity6'
	compileOnly 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	annotationProcessor 'org.projectlombok:lombok'
	providedRuntime 'org.springframework.boot:spring-boot-starter-tomcat'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter-test:3.0.3'
	testImplementation 'org.springframework.security:spring-security-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	
	runtimeOnly 'com.oracle.database.jdbc:ojdbc11:23.6.0.24.10'

	// Java Mail
	implementation 'org.springframework.boot:spring-boot-starter-mail'
	
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	
	// spring security taglib
	implementation 'org.springframework.security:spring-security-taglibs'

	// log4j2
	implementation 'org.springframework.boot:spring-boot-starter-log4j2'

	// log4jdbc
    implementation 'org.bgee.log4jdbc-log4j2:log4jdbc-log4j2-jdbc4.1:1.16'

     //RSET Test springdoc(swagger)
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.6.0'
    testImplementation 'org.springdoc:springdoc-openapi-starter-webmvc-api:2.6.0'

    // bootstrap
    implementation 'org.webjars:bootstrap:5.3.3'

    // AJAX axios
    implementation 'org.webjars.npm:axios:1.7.4'

    // thymeleaf dialect
    implementation 'nz.net.ultraq.thymeleaf:thymeleaf-layout-dialect:3.3.0'

    // bootstrap icons
    implementation 'org.webjars.npm:bootstrap-icons:1.11.3'

    //Spring Session을 JDBC를 사용하여 구현
    implementation 'org.springframework.session:spring-session-jdbc'

    // jQuery
    implementation 'org.webjars:jquery:3.7.1'

    // Assertj
    // testImplementation 'org.assertj:assertj-core:3.23.1'

	// Gson
	implementation 'com.google.code.gson:gson:2.11.0'

	// JSON
	implementation 'org.json:json:20210307'

	// spring doc : rest tester
	// https://mvnrepository.com/artifact/org.springdoc/springdoc-openapi-ui
	implementation 'org.springdoc:springdoc-openapi-ui:2.6.0'

	implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
	
	// summernote
	implementation 'org.webjars.npm:summernote:0.8.18'
	
	// file upload
	implementation 'commons-fileupload:commons-fileupload:1.5'
	
	// summernote image → Image Resize(이미지 크기 재조정) library(라이브러리)
	// site : https://github.com/rkalla/imgscalr
	// library : https://mvnrepository.com/artifact/org.imgscalr/imgscalr-lib
	// API referece doc : https://javadoc.io/doc/org.imgscalr/imgscalr-lib/latest/index.html
	implementation 'org.imgscalr:imgscalr-lib:4.2'
	
	// https://mvnrepository.com/artifact/org.jsoup/jsoup
	implementation 'org.jsoup:jsoup:1.18.1'
}

tasks.named('test') {
	useJUnitPlatform()
}
