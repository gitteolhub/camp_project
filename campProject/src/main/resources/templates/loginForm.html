<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="kr-ko">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .login-container {
            background-color: white;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            width: 300px;
        }

        h2 {
            text-align: center;
            color: #333;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #555;
        }

        input[type="text"], input[type="password"] {
            width: 90%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        button {
            width: 97%;
            padding: 10px;
            background-color: #808080;
            border: none;
            border-radius: 4px;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #696969;
        }

        .error-message {
            color: red;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h2>Login Page</h2>
        <!-- TODO 나중에 수정해야함!! action=""부분  -->
        <form action="" method="post">
            <div class="form-group">
                <label for="userid">ID:</label>
                <input type="text"
					   class="form-control ms-0"
					   id="userid"
					   name="userid"
					   required
					   pattern="[a-zA-Z]{1}\w{7,19}"
					   title="아이디는 영문자로 시작하여 8~20자 사이로 작성하여 주십시오" />
            </div>
            <div class="form-group">
                <label for="password">Password:</label>
                <input type="text"
					   class="form-control"
					   id="password"
					   name="password"
					   required
					   pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z])(?=.*\W).{8,20}"
					   title="비밀번호는 영문 대소문자 및 숫자, 특수문자를 최소 1개 이상 포함하여 8~20 사이로 작성하여 주십시오." />
            </div>
            <div class="form-group">
                <button type="submit">Login</button>
            </div>
            <div class="error-message" th:if="${param.error}">
                로그인 실패! 아이디와 비밀번호를 확인하세요.
            </div>
        </form>
    </div>
</body>
</html>
