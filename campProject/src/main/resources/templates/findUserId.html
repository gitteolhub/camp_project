<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:include="layout/header :: header-head">
    <meta charset="UTF-8">
    <title>아이디 찾기</title>
    <style>
        body {

            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .login-container {
            background-color: white;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            width: 300px;
        }

        h2 {
            text-align: center;
            color: #333;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #555;
        }

        input[type="text"], input[type="email"] {
            width: 93%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        input[type="submit"] {
            width: 100%;
            padding: 10px;
            background-color: #808080;
            border: none;
            border-radius: 4px;
            color: white;
            cursor: pointer;
            font-weight: bold; /* 버튼 텍스트를 더 두껍게 */
        }

        input[type="submit"]:hover {
            background-color: #696969; /* 호버 시 색상 변경 */
        }

        .msg {
            text-align: center;
            margin-top: 10px;
        }

        .success-message {
            color: green;
        }

        .error-message {
            color: red;
        }
    </style>
</head>
<body>
<!-- 헤더 포함 -->
  <div th:include="layout/header :: header"></div>

    <div class="login-container">
        <h2>아이디 찾기</h2>
        <form th:action="@{/findUserIdProc}" method="get">
            <div class="form-group">
                <label for="name">이름:</label>
                <input type="text" id="name" name="strName" required>
            </div>
            <div class="form-group">
            	<label for="email">이메일:</label>
                <input type="email" id="email" name="strEmail"
		               pattern = "^[a-zA-Z0-9._%+-]+@[naa-zA-Z0-9.-]+\.[a-zA-Z]{2,4}$" title="정확한 이메일을 입력해주세요" required/>
            </div>
            <input type="submit" value="아이디 찾기">
        </form>
        <div class="msg" th:if="${msg}">
            <p class="success-message" th:text="${msg}"></p>
        </div>
        <div class="error" th:if="${error}">
            <p class="error-message" th:text="${error}"></p>
        </div>
    </div>
</body>
</html>
