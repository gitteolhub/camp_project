<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="layout/header :: header-head">
  <title>관리자 관리</title>
  
  <style>
    /* 레이아웃을 위한 스타일 */
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
    }
    .container {
      width: 80%;
      margin: 0 auto;
      padding: 20px;
      background-color: #f9f9f9;
      border: 1px solid #ddd;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }
    .left-menu {
      float: left;
      width: 20%;
      padding: 20px;
      background-color: #f9f9f9;
      border: 1px solid #ddd;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      margin-right: 20px;
    }
    .left-menu ul {
      list-style: none;
      margin: 0;
      padding: 0;
    }
    .left-menu li {
      margin-bottom: 10px;
    }
    .left-menu a {
      text-decoration: none;
      color: #337ab7;
    }
    .left-menu a:hover {
      color: #23527c;
    }
    .content {
      float: left;
      width: 60%;
      padding: 20px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    .form-group label {
      display: block;
      margin-bottom: 10px;
    }
    .form-control {
      width: 100%;
      height: 40px;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }
    .btn {
      width: 100%;
      height: 40px;
      padding: 10px;
      background-color: #337ab7;
      color: #fff;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      margin-top: 2.5px;
      margin-bottom: 2.5px;
    }
    .btn:hover {
      background-color: #23527c;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }
    table, th, td {
      border: 1px solid #ddd;
    }
    th, td {
      padding: 10px;
      text-align: center;
    }
    th {
      background-color: #f2f2f2;
    }
  </style>
</head>
<body>

<!-- 헤더 포함 -->
  <div th:replace="layout/header :: header"></div>

  <div class="container">
    <div class="left-menu">
      <ul>
        <li sec:authorize="hasAnyRole('ROLE_USER', 'ROLE_CEO')"><a href="http://localhost:8181/campProject/myPageModification">회원정보 수정</a></li>
                <li sec:authorize="hasRole('ROLE_USER')"><a href="http://localhost:8181/campProject/myPageReservationCheck">예약 확인</a></li>
                <li sec:authorize="hasRole('ROLE_CEO')"><a href="http://localhost:8181/campProject/campGroundManagement">캠핑장 관리</a></li>
                <li sec:authorize="hasAnyRole('ROLE_ADMIN', 'ROLE_SUPER_ADMIN')"><a href="http://localhost:8181/campProject/userManagement">유저 관리</a></li>
                <li sec:authorize="hasRole('ROLE_SUPER_ADMIN')"><a href="http://localhost:8181/campProject/adminManagement">관리자 관리</a></li>
      </ul>
    </div>
    <div class="content">
      <h2>관리자 관리</h2>

      <!-- 관리자 추가 폼 -->
      <h3>새 관리자 추가</h3>
      <form method="post" action="/campProject/adminManagement/add">
        <div class="form-group">
          <label for="admin-email">이메일</label>
          <input type="email" id="admin-email" name="email" class="form-control" placeholder="관리자 이메일을 입력하세요" required>
        </div>
        <div class="form-group">
          <label for="admin-password">비밀번호</label>
          <input type="password" id="admin-password" name="password" class="form-control" placeholder="비밀번호를 입력하세요" required>
        </div>
        <button type="submit" class="btn">추가</button>
      </form>

      <!-- 관리자 목록 테이블 -->
      <h3>관리자 목록</h3>
      <table>
        <thead>
          <tr>
            <th>이메일</th>
            <th>역할</th>
            <th>수정</th>
            <th>삭제</th>
          </tr>
        </thead>
        <tbody>
          <!-- 관리자 정보는 서버에서 동적으로 로드 -->
          <tr>
            <td>admin@example.com</td>
            <td>ROLE_ADMIN</td>
            <td>
              <form method="post" action="/campProject/adminManagement/update" style="display:inline;">
                <input type="hidden" name="adminId" value="1">
                <button type="submit" class="btn">수정</button>
              </form>
            </td>
            <td>
              <form method="post" action="/campProject/adminManagement/delete" style="display:inline;">
                <input type="hidden" name="adminId" value="1">
                <button type="submit" class="btn">삭제</button>
              </form>
            </td>
          </tr>
          <!-- 더 많은 관리자 목록 -->
        </tbody>
      </table>
    </div>
  </div>
</body>
</html>
