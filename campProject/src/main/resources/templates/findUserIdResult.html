<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:include="layout/header :: header-head">
    <meta charset="UTF-8">
    <title>아이디 찾기 결과</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <style>
        .card {
            max-width: 400px; /* 카드의 최대 너비 설정 */
            margin: auto; /* 중앙 정렬 */
        }
        .text-center {
            font-size: 1.8rem;
        }
        .card-title {
            font-size: 1rem; /* 제목 글자 크기 조정 */
        }
        .btn-small {
            font-size: 0.8rem; /* 버튼 글자 크기 조정 */
            padding: 0.25rem 0.5rem; /* 버튼 패딩 조정 s*/
        }
        .btn-custom {
            background-color: #808080; /* 원하는 색상 */
            color: white; /* 글자 색상 */
        }
        .btn-custom:hover {
            background-color: #696969;/* 호버 시 색상 */
            color: white;
        }
        .user-id {
            font-weight: bold; /* 글자 두껍게 */
        }
    </style>
</head>
<body>
<!-- 헤더 포함 -->
  <div th:include="layout/header :: header"></div>

    <div class="container mt-5">
        <h2 class="text-center">아이디 찾기 결과</h2>
        <div class="card">
            <div class="card-body">
                <h5 class="card-title">회원 아이디: <span class="user-id" th:if="${userId != null}" th:text="${userId}"></span></h5>
                <p th:if="${error != null}">
            		<span th:text="${error}" style="color: red;"></span>
        		</p>
                <a href="/campProject/loginForm" class="btn btn-custom btn-small">로그인 페이지로 돌아가기</a>
            </div>
        </div>
    </div>
</body>
</html>
