<!DOCTYPE html>
<html 	xmlns:th="http://www.thymeleaf.org"
		lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>캠핑 추천</title>
    <!-- 부트 스트랩 -->
    <link rel="stylesheet" type="text/css" th:href="@{/bootstrap/5.3.3/css/bootstrap.min.css}">
    <!-- 부트 스트랩 아이콘 -->
    <link rel="stylesheet" type="text/css" th:href="@{/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/css/recomCampStyle.css}">

    <script>
	function parseCheck(obj) {

		console.log("아이디 : ", obj.id);
		obj.value = obj.checked == true ? "1" : "0";
	}

	window.onload = () =>{

		let sendBtn = document.getElementById("sendBtn");

		sendBtn.onclick = () => {

			let form = document.getElementById("recomForm");
			let formData = new FormData(form);

			// 카테고리 검색 요청
		    fetch(`/campProject/recomCampProc`, {
		        method: 'POST',
		        cache: 'no-cache',
		        body : formData,
		    })
		    .then(response => {
		        if (!response.ok) {
		            throw new Error('서버 응답이 정상적이지 않습니다.');
		        }
		        return response.json(); // JSON 응답 처리
		    })
		    .then(data => {

		    	console.log("data.length : " + data.length);

		        // 데이터가 없으면 메시지 출력
		        if (!data || data.length === 0) {
		            results.innerHTML = `<p>검색에 대한 결과가 없습니다.</p>`;
		            return;
		        }

		        let resultRecom = document.getElementById("resultRecom");

		        let resultsHTML = ''; // 추가

		        // 데이터 행 추가
		        data.forEach(camp => {

		            const address = camp.roadAddress ? camp.roadAddress : camp.jibunAddress; // 주소 처리

		            resultsHTML += `
		                <div style="margin-bottom: 20px; border: 1px solid #ddd; padding: 10px; border-radius: 8px;">
		               		<p><img src="/campProject/campImg/${camp.imgName}" style="width:100%"></p>
		                	<h3> ${camp.campName}</h3>
		                    <p><strong>종류:</strong> ${camp.cate3}</p>
		                    <p><strong>주소:</strong> ${address}</p>
		                    <p><strong>시설 특징:</strong> ${camp.facilCharacteristics}</p>
		                    <p><strong>시설 상세:</strong> ${camp.facilDetail}</p>
		                    <p><strong>고객 요청 만족도 : ${camp.satisfaction}</strong></p>
		                    <p><strong>네이버 평점 :</strong> ${camp.avgRating == 0 ? "없음" : camp.avgRating}</p>
		                    <p><strong>네이버 긍정평 갯수 :</strong> ${camp.reviewPositive}</p>
		                    <p><strong>네이버 부정평 갯수 :</strong> ${camp.reviewNegative}</p>
		                </div>
		            `;
		        });

		        // 결과를 HTML로 표시
		        resultRecom.innerHTML = resultsHTML;
		    })
		    .catch(error => {
		        console.error('추가 검색 중 오류가 발생했습니다:', error);
		    });

		} // 클릭

	}
    </script>
</head>
<body>
	<div class="container">
        <h1 style="margin: 20px 0;">캠핑장 추천!!!</h1>

		<div id="recomMenu">

        	<form id="recomForm">

        		<div>

					<label for="time" class="form-label"></label>
  					<input type="date" class="form-control" id="time" name="time" /><br>

					<input type="text" id="destination" name="destination" placeholder="해당 지역을 입력하십시오. 예) 평택" /><br>

					<input type="checkbox" class="btn-check" autocomplete="off" id="isElectricity" name="isElectricity"  value="0" onclick="parseCheck(this)" />
					<label class="btn btn-outline-primary" for="isElectricity">전기 시설</label>

					<input type="checkbox" class="btn-check" autocomplete="off" id="isWifi" name="isWifi"  value="0" onclick="parseCheck(this)" />
					<label class="btn btn-outline-primary" for="isWifi">인터넷</label>

					<input type="checkbox" class="btn-check" autocomplete="off" id="isCampfire" name="isCampfire"  value="0" onclick="parseCheck(this)" />
					<label class="btn btn-outline-primary" for="isCampfire">캠프파이어</label>

					<input type="checkbox" class="btn-check" autocomplete="off" id="isHeater" name="isHeater"  value="0" onclick="parseCheck(this)" />
					<label class="btn btn-outline-primary" for="isHeater">온수시설</label>

					<input type="checkbox" class="btn-check" autocomplete="off" id="isPool" name="isPool"  value="0" onclick="parseCheck(this)" />
					<label class="btn btn-outline-primary" for="isPool">풀장</label>

					<input type="checkbox" class="btn-check" autocomplete="off" id="isPlayground" name="isPlayground"  value="0" onclick="parseCheck(this)" />
					<label class="btn btn-outline-primary" for="isPlayground">운동장</label>

					<input type="checkbox" class="btn-check" autocomplete="off" id="isSink" name="isSink"  value="0" onclick="parseCheck(this)" />
					<label class="btn btn-outline-primary" for="isSink">주방시설</label>

					<input type="checkbox" class="btn-check" autocomplete="off" id="isTrail" name="isTrail"  value="0" onclick="parseCheck(this)" />
					<label class="btn btn-outline-primary" for="isTrail">산책시설</label>

					<input type="checkbox" class="btn-check" autocomplete="off" id="isMaritimeLeisure" name="isMaritimeLeisure"  value="0" onclick="parseCheck(this)" />
					<label class="btn btn-outline-primary" for="isMaritimeLeisure">수상레저</label>

					<input type="checkbox" class="btn-check" autocomplete="off" id="isFishing" name="isFishing"  value="0" onclick="parseCheck(this)" />
					<label class="btn btn-outline-primary" for="isFishing">낚시</label>

					<input type="checkbox" class="btn-check" autocomplete="off" id="petYn" name="petYn"  value="0" onclick="parseCheck(this)" />
					<label class="btn btn-outline-primary" for="petYn">펫 동반</label>

			    	<button type="button" id="sendBtn">검색</button>

		    	</div>

			</form>

		</div>

		<!-- 추천 캠프 리스트 -->
		<div id="resultRecom">

		</div>


	</div>
</body>
</html>
