<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	  xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <th:block th:replace="layout/header :: header-head"></th:block>
  <title>사용자 관리</title>
  
  <style>
    /* 레이아웃을 위한 스타일 */
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
    }
    .container {
      width: 80%;
      margin: 0 auto;
      padding: 20px;
      background-color: #f9f9f9;
      border: 1px solid #ddd;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }
    .left-menu {
      float: left;
      width: 20%;
      padding: 20px;
      background-color: #f9f9f9;
      border: 1px solid #ddd;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      margin-right: 20px;
    }
    .left-menu ul {
      list-style: none;
      margin: 0;
      padding: 0;
    }
    .left-menu li {
      margin-bottom: 10px;
    }
    .left-menu a {
      text-decoration: none;
      color: #337ab7;
    }
    .left-menu a:hover {
      color: #23527c;
    }
    .content {
      float: left;
      width: 60%;
      padding: 20px;
    }
    .search-bar {
      margin-bottom: 20px;
    }
    .search-input {
      width: 70%;
      height: 40px;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }
    .search-btn {
      width: 25%;
      height: 40px;
      padding: 10px;
      background-color: #337ab7;
      color: #fff;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      margin-left: 10px;
    }
    .search-btn:hover {
      background-color: #23527c;
    }
    .admin-table {
      width: 100%;
      border-collapse: collapse;
    }
    .admin-table th, .admin-table td {
      padding: 10px;
      border: 1px solid #ddd;
      text-align: center;
    }
    .admin-table th {
      background-color: #337ab7;
      color: white;
    }
    .action-btn {
      padding: 5px 10px;
      background-color: #337ab7;
      color: #fff;
      border: none;
      border-radius: 3px;
      cursor: pointer;
    }
    .action-btn:hover {
      background-color: #23527c;
    }
  </style>
  <script>
  window.onload=()=>{
	let actionBtns = document.querySelectorAll('.action-btn');
	for(let actionBtn of actionBtns) {
		actionBtn.onclick=(e)=>{
			let id = e.target.title;
			console.log("id: ", id);
			//TODO AJAX(fetch or axios로 이벤트 처리해서 role 변경 구현)
		}
	}
  }
  </script>
</head>
<body>

<!-- 헤더 포함 -->
 	<th:block th:include="layout/header :: header"></th:block>

	<div class="container">
<!-- 	users:[[${users}]] -->
	  <div class="left-menu">
	    <ul>
	      <li sec:authorize="hasAnyRole('ROLE_USER', 'ROLE_CEO', 'ROLE_ADMIN')"><a href="http://localhost:8181/campProject/myPageModification">회원정보 수정</a></li>
	      <li sec:authorize="hasRole('ROLE_USER')"><a href="http://localhost:8181/campProject/myPageReservationCheck">예약 확인</a></li>
	      <li sec:authorize="hasRole('ROLE_CEO')"><a href="http://localhost:8181/campProject/campGroundManagement">캠핑장 관리</a></li>
	      <li sec:authorize="hasRole('ROLE_ADMIN')"><a href="http://localhost:8181/campProject/userManagement">유저 관리</a></li>
	    </ul>
	  </div>
	  <div class="content">
	    <h2>사용자 관리</h2>
	  <div class="search-dropdown">
		  <select id="category-filter">
		    <option value="all">전체</option>
		    <option value="ROLE_ADMIN">관리자</option>
		    <option value="ROLE_CEO">사업자</option>
		    <option value="ROLE_USER">사용자</option>
		  </select>

	  </div>
	    <table class="admin-table">
	      <thead>
	        <tr>
	          <th>ID</th>
	          <th>이름</th>
	          <th>이메일</th>
	          <th>역할</th>
	          <th>상태</th>
	          <th>관리</th>
	        </tr>
	      </thead>
	      <tbody>
	      
<!--	  디자인 예시    
		  <tr> 
	          <td>1</td>
	          <td>김관리자</td>
	          <td>admin@example.com</td>
	          <td>관리자</td>
	          <td>활성</td>
	          <td>
	            <button class="action-btn">관리자 임명/해제</button>
	          </td>
	        </tr> -->
	        
	        <!-- 자체 로그인 회원들 -->
	        <tr th:each="user : ${users}">
	          <td th:text="${user.get('ID')}"></td>
	          <td th:text="${user.get('NAME')}"></td>
	          <td th:text="${user.get('EMAIL')}"></td>
	          <td th:text="${user.get('ROLE')=='ROLE_ADMIN' ? '관리자' : user.get('ROLE')=='ROLE_CEO' ? '사업자' : '사용자'}"></td>
	          <td>활성</td>
	          <td>
	            <button class="action-btn" th:title="${user.get('ID')}">관리자 임명/해제</button>
	          </td>
	        </tr>
	        
	        <!-- 소셜 로그인 회원들 -->
	        <tr th:each="socialUser : ${socialUsers}">
	          <td th:text="${socialUser.id}"></td>
	          <td th:text="${socialUser.name}"></td>
	          <td th:text="${socialUser.email}"></td>
	          <td th:text="${socialUser.role=='ROLE_ADMIN' ? '관리자' : socialUser.role=='ROLE_CEO' ? '사업자' : '사용자'}"></td>
	          <td>활성</td>
	          <td>
	            <button class="action-btn" th:title="${socialUser.id}">관리자 임명/해제</button>
	          </td>
	        </tr>
	        
	      </tbody>
	    </table>
	  </div>
	</div>
</body>
</html>
