<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>비밀번호 재설정</title>
    <style>
        body {
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .login-container {
            background-color: white;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            width: 300px;
        }

        h2 {
            text-align: center;
            color: #333;
        }

        h5 {
            text-align: center;
            color: #555;
            margin: 5px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #555;
        }

        input[type="text"], input[type="password"] {
            width: 93%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        input[type="button"] {
            width: 100%;
            padding: 10px;
            background-color: #808080;
            border: none;
            border-radius: 4px;
            color: white;
            cursor: pointer;
            font-weight: bold;
        }

        input[type="button"]:hover {
            background-color: #696969;
        }

        .error-message {
            color: red;
        }
    </style>
    <script>
        function validatePasswords() {
        	console.log("validatePasswords");
        	var frm = document.getElementById("frm");
            var newPw = document.getElementById("newPw").value;
            var confirmPw = document.getElementById("confirmPw").value;
            var code = document.getElementById("code").value;
            var submitButton = document.querySelector('input[type="submit"]');

            if (newPw !== confirmPw) {
               // submitButton.disabled = true; // 버튼 비활성화
                alert("비밀번호가 일치하지 않습니다.");
                frm.reset();
            } else {
               // submitButton.disabled = false; // 버튼 활성화
               alert("비밀번호 일치합니다.");
               let regex=/\d{6}/;
               
               if(regex.test(code)==true){
               	   frm.submit();
               } else {
            	   alert("인증번호 숫자 6자리로 입력하세요");
               }
            }
        }
    </script>
</head>
<body>
    <div class="login-container">
        <h2>비밀번호 재설정</h2>
        <h5>신규 비밀번호를 입력해 주세요.</h5>
        <h5>이메일로 전송된 인증 번호를 입력해 주세요.</h5>
        <br>
        <form id="frm" th:action="@{/pwVerificationCode}" method="post">
            <div class="form-group">
                <label for="newPw">신규 비밀번호:</label>
                <input type="text" id="newPw" name="newPw" required 
                	   pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z])(?=.*\W).{8,20}"
					   title="비밀번호는 영문 대소문자 및 숫자, 특수문자를 최소 1개 이상 포함하여 8~20 사이로 작성하여 주십시오." />
            </div>
            <div class="form-group">
                <label for="confirmPw">비밀번호 확인:</label>
                <input type="text" id="confirmPw" name="confirmPw" required 
                	   pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z])(?=.*\W).{8,20}"
					   title="비밀번호는 영문 대소문자 및 숫자, 특수문자를 최소 1개 이상 포함하여 8~20 사이로 작성하여 주십시오." />
            </div>
            <div class="form-group">
                <label for="code">인증 번호:</label>
                <input type="text" id="code" name="code" required>
                <input type="hidden" name="email" th:value="${email}">
            </div>
            <input type="button" value="비밀번호 변경" onclick="validatePasswords()">
        </form>
        <div class="error" th:if="${error}">
            <p class="error-message" th:text="${error}"></p>
        </div>
    </div>
</body>
</html>
