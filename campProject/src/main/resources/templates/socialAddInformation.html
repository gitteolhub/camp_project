<!DOCTYPE html>
<html lang="ko-kr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Social login Add Information</title>
    <!-- <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css"> -->
    <style>
        body {
            
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-container {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            width: 300px;
        }
        .login-title {
            text-align: center;
            margin-bottom: 20px;
            font-size: 24px;
            color: #333;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
        }
        input[type="text"],
        input[type="date"],
        input[type="tel"],
        input[type="radio"] {
            width: 93%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        .radio-group {
            display: flex; /* Flexbox 사용 */
            justify-content: space-between; /* 공간을 균등하게 분배 */
            align-items: center; /* 세로 중앙 정렬 */
        }
        .radio-group label{
            display: flex;
            align-items: center;
            margin-right: 95px; /* 라디오 버튼과 레이블 사이의 간격 */
        }
        input[type="radio"] {
            margin-right: 5px; /* 라디오 버튼과 레이블 사이의 간격 */
            width: auto; /* 라디오 버튼 크기 조정 */
        }
        input[type="submit"] {
            background: #5cb85c;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
        }
        input[type="submit"]:hover {
            background: #4cae4c;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-title">회원 정보 추가</div>
        <div th:if="${session.socialUser != null}">
            <div th:if="${session.socialUser.authVendor == 'google' && session.socialUser.gender == '없음' && session.socialUser.birthday == '없음' && session.socialUser.mobile == '없음'}">
                <form method="post" th:action="@{/social/updateGoogle}">
                    <div class="form-group">
                        <label>성별</label>
                        <div class="radio-group">
                            <label>여자<input type="radio" name="gender" value="F" required></label>
                            <label>남자<input type="radio" name="gender" value="M" required></label>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>생일</label>
                        <input type="date" name="birthday" th:value="${session.socialUser.birthday}" pattern="\d{4}-\d{2}-\d{2}"  title="2000-01-01 형식으로 생일을 입력하십시오" required>
                    </div>
                    <div class="form-group">
                        <label>전화번호</label>
                        <input type="tel" name="mobile" pattern="\d{3}-\d{3,4}-\d{4}" title="전화번호를 010-1234-5678 형식으로 입력하십시오" required>
                    </div>
                    <input type="hidden" name="email" th:value="${session.socialUser.email}">
                    <input type="hidden" name="name" th:value="${session.socialUser.name}">
                    <input type="submit" value="가입">
                </form>
            </div>
        </div>
    </div>
</body>
</html>
