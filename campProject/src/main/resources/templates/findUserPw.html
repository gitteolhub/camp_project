<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>비밀번호 찾기</title>
    <style>
        body {
            
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .login-container {
            background-color: white;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            width: 300px;
        }

        h2 {
            text-align: center;
            color: #333;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #555;
        }

        input[type="text"] {
            width: 93%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        input[type="submit"] {
            width: 100%;
            padding: 10px;
            background-color: #808080;
            border: none;
            border-radius: 4px;
            color: white;
            cursor: pointer;
            font-weight: bold;
        }

        input[type="submit"]:hover {
            background-color: #696969;
        }

        .msg {
            text-align: center;
            margin-top: 10px;
        }

        .success-message {
            color: green;
        }

        .error-message {
            color: red;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h2>비밀번호 찾기</h2>
        <form th:action="@{/findUserPwProc}" method="get">
            <div class="form-group">
                <label for="userid">아이디:</label>
                <input type="text"
					   id="userId"
					   name="strId"
					   required
					   pattern="[a-zA-Z]{1}\w{7,19}"
					   title="아이디는 영문자로 시작하여 8~20자 사이로 작성하여 주십시오" />
            </div>
            <input type="submit" value="비밀번호 찾기">
        </form>
        <div class="error" th:if="${error}">
            <p class="error-message" th:text="${error}"></p>
        </div>
    </div>
</body>
</html>
