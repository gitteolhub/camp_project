<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="header-head">
    <meta charset="UTF-8">
    <title>[[${headerName}]]</title>
    <style>
        /* 마이페이지와 같은 레이아웃 스타일 */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }
        .container {
            width: 80%;
            margin: 0 auto;
            padding: 20px;
            background-color: #f9f9f9;
            border: 1px solid #ddd;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        .left-menu {
            float: left;
            width: 20%;
            padding: 20px;
            background-color: #f9f9f9;
            border: 1px solid #ddd;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            margin-right: 20px;
        }
        .left-menu ul {
            list-style: none;
            margin: 0;
            padding: 0;
        }
        .left-menu li {
            margin-bottom: 10px;
        }
        .left-menu a {
            text-decoration: none;
            color: #337ab7;
        }
        .left-menu a:hover {
            color: #23527c; /* 마우스 올렸을 때 색상 변경 */
        }
        .content {
            float: left;
            width: 60%;
            padding: 20px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 10px;
        }
        .form-control {
            width: 100%;
            height: 40px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        .btn {
            width: 100%;
            height: 40px;
            padding: 10px;
            background-color: #337ab7;
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 2.5px;
            margin-bottom: 2.5px;
        }
        .btn:hover {
            background-color: #23527c;
        }

        /* 헤더 스타일 */
        header {
            padding: 10px 0;
            background-color: #f9f9f9;
            border-bottom: 1px solid #ddd;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }
        nav {
            text-align: right; /* 메뉴를 오른쪽으로 정렬 */
            margin-right: 20px;
        }
        nav ul {
            list-style: none;
            padding: 0;
            margin: 0;
            display: inline-block;
        }
        nav ul li {
            display: inline;
            margin-left: 15px; /* 메뉴 간 간격 설정 */
        }
        nav ul li a, nav ul li button {
            text-decoration: none;
            font-size: 16px;
            color: #337ab7;
        }
        nav ul li button {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 16px;
            color: #337ab7;
        }
        nav ul li a:hover, nav ul li button:hover {
            color: #23527c; /* 마우스 올렸을 때 색상 */
        }
    </style>
</head>
<body>

<header th:fragment="header">
    <nav>
        <ul>
            <li><a href="/" th:href="@{/}">홈</a></li>
            <li sec:authorize="!isAuthenticated()"><a href="/login" th:href="@{/loginForm}">로그인</a></li>
            <!-- TODO 권한별 마이페이지로 이동하게 수정 -->
            <li sec:authorize="isAuthenticated()"><a href="/myPageModification" th:href="@{/myPageModification}">마이페이지</a></li>
            <li sec:authorize="hasRole('ROLE_ADMIN')"><a href="/admin/user" th:href="@{/admin/user}">유저 관리</a></li>
            <li sec:authorize="hasRole('ROLE_SUPER_ADMIN')"><a href="/admin/manager" th:href="@{/admin/manager}">관리자 관리</a></li>
			<li sec:authorize="isAuthenticated()">
			    <span th:if="${session.socialUser == null}">
			        <form th:action="@{/logout}" method="post" style="display: inline;">
			            <button type="submit">로그아웃(자체)</button>
			        </form>
			    </span>
			    <span th:if="${session.socialUser != null}">
			        <span th:if="${session.socialUser.authVendor != 'naver'}">
			            <form th:action="@{/logout}" method="post" style="display: inline;">
			                <button type="submit">로그아웃(Google)</button>
			            </form>
			        </span>
			        <span th:if="${session.socialUser.authVendor == 'naver'}">
			            <a href="#" onclick="naverLogout()">로그아웃(Naver)</a>
			        </span>
			    </span>
			</li>
        </ul>
    </nav>
</header>

</body>
</html>
