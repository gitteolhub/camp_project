<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <th:block th:replace="layout/header :: header-head"></th:block>
  <title>마이페이지 일반유저 예약 확인</title>

  <style>
    /* 레이아웃을 위한 스타일 */
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
    }
    .container {
      width: 80%;
      margin: 0 auto;
      padding: 20px;
      background-color: #f9f9f9;
      border: 1px solid #ddd;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }
    .left-menu {
      float: left;
      width: 20%;
      padding: 20px;
      background-color: #f9f9f9;
      border: 1px solid #ddd;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      margin-right: 20px;
    }
    .left-menu ul {
      list-style: none;
      margin: 0;
      padding: 0;
    }
    .left-menu li {
      margin-bottom: 10px;
    }
    .left-menu a {
      text-decoration: none;  /* 하이퍼링크 밑줄 제거 */
      color: #337ab7;
    }
    .left-menu a:hover {
      color: #23527c;
    }
    .content {
      float: left;
      width: 60%;
      padding: 20px;
    }
    .reservation-list {
      border-collapse: collapse;
      width: 100%;
      margin-top: 20px;
    }
    .reservation-list th, .reservation-list td {
      border: 1px solid #ddd;
      padding: 10px;
      text-align: left;
    }
    .reservation-list th {
      background-color: #f2f2f2;
    }
    .btn {
      width: 100%;
      height: 40px;
      padding: 10px;
      background-color: #337ab7;
      color: #fff;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      margin-top: 10px;
    }
    .btn:hover {
      background-color: #23527c;
    }
  </style>

  <script>
  window.onload=()=>{
	  let btns = document.querySelectorAll(".btn");
	  for (let btn of btns) {
		  btn.onclick=(e)=>{
			  console.log("e.target.title: ", e.target.title);
			  let arr = e.target.title.split("_");
			  let id = arr[0];
			  let campId = arr[1];
			  location.href=`/campProject/deleteReservation?id=${id}&campId=${campId}`;
		  }
	  }
  }
  </script>
</head>
<body>
<!-- 헤더 포함 -->
  <th:block th:include="layout/header :: header"></th:block>

  <div class="container">
  <!-- reservationList=[[${reservationList}]] -->

    <div class="left-menu">
      <ul>
	      <li sec:authorize="hasAnyRole('ROLE_USER', 'ROLE_CEO', 'ROLE_ADMIN')"><a href="http://localhost:8181/campProject/myPageModification">회원정보 수정</a></li>
	      <li sec:authorize="hasRole('ROLE_USER')"><a href="http://localhost:8181/campProject/myPageReservationCheck">예약 확인</a></li>
	      <li sec:authorize="hasRole('ROLE_CEO')"><a href="http://localhost:8181/campProject/campGroundManagement">캠핑장 관리</a></li>
	      <li sec:authorize="hasRole('ROLE_ADMIN')"><a href="http://localhost:8181/campProject/userManagement">유저 관리</a></li>
      </ul>
    </div>
    <div class="content">
      <h2>캠핑 예약 확인</h2>
      <table class="reservation-list">
        <thead>
          <tr>
            <th>캠핑장 번호(id)</th>
            <th>캠핑장 이름</th>
            <th>예약 날짜</th>
            <th>예약 취소</th>
          </tr>
        </thead>
        <tbody>

<!--        양식 예시
			<tr>
            <td>12345</td>
            <td>힐링 캠핑장</td>
            <td>2024-11-25 ~ 2024-11-26</td>
            <td><button class="btn">취소</button></td>
          </tr> -->

          <tr th:each="reservation, st : ${reservationList}">
            <td th:text="${reservation.id}"></td>
            <td th:text="${reservation.campName}"></td>
            <td th:text="${reservation.checkIn + ' ~ ' + reservation.checkOut}"></td>
            <td><button class="btn" th:title="${reservation.id + '_' + reservation.campId}">취소</button></td>
          </tr>

        </tbody>
      </table>
    </div>
  </div>
</body>
</html>
