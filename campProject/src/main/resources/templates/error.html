<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko-kr">
<head>
<meta charset="UTF-8">
<title>global error page</title>

	<!-- thymeleaf를 사용하여 JavaSoript코드를 동적으로 생성
		 errMsg가 null가 아닐 경우에만 th:if="${errMsg != null}" charset="UTF-8  -->
	<script th:inline="javascript" charset="UTF-8">
		let errMsg=[[${errMsg}]]
		let movePage=[[${movePage}]]

		if(errMsg=='' || errMsg==null){
			// alert("홈페이지로 이동됩니다.");
			location.href='/campProject/';
		} else {

			alert(errMsg);
			location.href='/campProject' + movePage;
		}
	</script>

</head>
<body>

</body>
</html>
