<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>사업자 회원가입</title>
    <script src="http://dmaps.daum.net/map_js_init/postcode.v2.js"></script>
    <script th:src="@{'/axios/1.7.4/dist/axios.min.js'}"></script>
    <script th:src="@{'/js/join.js'}" charset="UTF-8"></script>
    
    <style>
        /* 기본적인 스타일 */
        body { font-family: Arial, sans-serif; margin: 20px; }
        .container { max-width: 500px; margin: 0 auto; padding: 20px; }
        .form-footer { margin-top: 20px; text-align: center; }
        .form-footer a { text-decoration: none; color: blue; }

        /* input 필드 공통 스타일 */
        .input-field { width: 100%; padding: 8px; margin: 10px 0; box-sizing: border-box; }
        label { font-size: 14px; font-weight: bold; margin-bottom: 5px; display: inline-block; }

        /* 우편번호 찾기 버튼 스타일 */
        .zipcode-btn { padding: 8px 12px; margin-left: 5px; cursor: pointer; }
    </style>
    
    <script>
    
 	// 주소 검색
  	function getPostcodeAddress() {
    	new daum.Postcode({
      	oncomplete: function(data) {
        	// 선택한 주소 정보를 각 필드에 입력
        	var roadAddress = data.roadAddress; // 도로명 주소
        	var jibunAddress = data.jibunAddress; // 지번 주소
        	var zipcode = data.zonecode; // 우편번호

        	// 도로명 주소, 지번 주소, 우편번호 필드에 값 삽입
        	document.getElementById('zip').value = zipcode;
        	document.getElementById('roadaddress').value = roadAddress;
        	document.getElementById('jibunAddress').value = jibunAddress;
      	}
    	}).open(); // 주소 검색창 열기
  	}

	</script>
	
</head>
<body>

<div class="container">
    <h2>회원가입</h2>
    <form th:action="@{'/member/joinProc2'}"  method="POST">
        <!-- 이름 -->
        <label for="name">이름</label>
        <input class="input-field" type="text" id="name" name="name" required placeholder="이름을 입력하세요">

        <!-- 이메일 -->
        <label for="email">이메일</label>
        <input class="input-field" type="email" id="email" name="email" required placeholder="이메일을 입력하세요">

        <!-- 비밀번호 -->
        <label for="password">비밀번호</label>
        <input class="input-field" type="password" id="password" name="password" required placeholder="비밀번호를 입력하세요">

        <!-- 비밀번호 확인 -->
        <label for="confirm_password">비밀번호 확인</label>
        <input class="input-field" type="password" id="confirm_password" name="confirm_password" required placeholder="비밀번호를 다시 입력하세요">

		<!-- 전화번호 -->
        <label for="businessnum">사업자 번호</label>
        <input class="input-field" type="number" id="businessnum" name="businessnum" placeholder="사업자 번호를 입력하세요">
        
        <!-- 전화번호 -->
        <label for="phone">전화번호</label>
        <input class="input-field" type="tel" id="phone" name="phone" placeholder="전화번호를 입력하세요">

        <!-- 생년월일 -->
        <label for="dob">생년월일</label>
        <input class="input-field" type="date" id="dob" name="dob">

        <!-- 주소 -->
        <fieldset>
            <legend>주소</legend>
            <label for="zip">우편번호</label>
            <div>
                <input class="input-field" type="text" id="zip" name="zip" placeholder="우편번호" readonly>
                <button type="button" class="btn btn-primary me-2" id="address_search_btn" onclick="getPostcodeAddress()">주소 검색</button>
            </div>
            
            <label for="roadaddress">도로명 주소</label>
            <input class="input-field" type="text" id="roadaddress" name="roadaddress" readonly />
            
            <label for="jibunAddress">지번 주소</label>
            <input class="input-field" type="text" id="jibunAddress" name="jibunAddress" readonly />
            
            <label for="detail_address">상세 주소</label>
            <input class="input-field" type="text" id="detail_address" name="detail_address" placeholder="상세 주소를 입력하세요">
            
        </fieldset>

        <!-- 가입 버튼 -->
        <input class="input-field" type="submit" value="가입하기">
    </form>

    <div class="form-footer">
        <p>이미 계정이 있으신가요? <a th:href="@{/loginFrom}">로그인</a></p>
    </div>
</div>

</body>
</html>
