<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <th:block th:replace="layout/header :: header-head"></th:block>
  <title>캠핑장 관리</title>
  
  <style>
    /* 레이아웃을 위한 스타일 */
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
    }
    .container {
      width: 80%;
      margin: 0 auto;
      padding: 20px;
      background-color: #f9f9f9;
      border: 1px solid #ddd;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }
    .left-menu {
      float: left;
      width: 20%;
      padding: 20px;
      background-color: #f9f9f9;
      border: 1px solid #ddd;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      margin-right: 20px;
    }
    .left-menu ul {
      list-style: none;
      margin: 0;
      padding: 0;
    }
    .left-menu li {
      margin-bottom: 10px;
    }
    .left-menu a {
      text-decoration: none;
      color: #337ab7;
    }
    .left-menu a:hover {
      color: #23527c;  /* 마우스 올렸을 때 색상 변경 */
    }
    .content {
      float: left;
      width: 60%;
      padding: 20px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    .form-group label {
      display: block;
      margin-bottom: 10px;
    }
    .form-control {
      width: 100%;
      height: 40px;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }
    .btn {
      width: 100%;
      height: 40px;
      padding: 10px;
      background-color: #337ab7;
      color: #fff;
      border: none;
      border-radius: 5px;
      cursor: pointer;  /* 버튼에 마우스 올리면 손가락모양 포인터로 변경 */
      margin-top: 2.5px;
      margin-bottom: 2.5px;
    }
    .btn:hover {
      background-color: #23527c;  /* 버튼에 마우스 올렸을 때 버튼색 변경 */
    }
  </style>
</head>
<body>

<!-- 헤더 포함 -->
  <th:block th:replace="layout/header :: header"></th:block>

  <div class="container">
    <div class="left-menu">
      <ul>
        <li sec:authorize="hasAnyRole('ROLE_USER', 'ROLE_CEO')"><a href="http://localhost:8181/campProject/myPageModification">회원정보 수정</a></li>
                <li sec:authorize="hasRole('ROLE_USER')"><a href="http://localhost:8181/campProject/myPageReservationCheck">예약 확인</a></li>
                <li sec:authorize="hasRole('ROLE_CEO')"><a href="http://localhost:8181/campProject/campGroundManagement">캠핑장 관리</a></li>
                <li sec:authorize="hasAnyRole('ROLE_ADMIN', 'ROLE_SUPER_ADMIN')"><a href="http://localhost:8181/campProject/userManagement">유저 관리</a></li>
                <li sec:authorize="hasRole('ROLE_SUPER_ADMIN')"><a href="http://localhost:8181/campProject/adminManagement">관리자 관리</a></li>
      </ul>
    </div>
    <div class="content">
      <h2>캠핑장 목록</h2>
      <table>
        <tr>
          <th>캠핑장 이름</th>
          <th>캠핑장 주소</th>
          <th>캠핑장 전화번호</th>
          <th>캠핑장 이메일</th>
        </tr>
        <!-- TODO 캠핑장 목록을 DB에서 가져와서 표시 -->
        <tr th:each="campground : ${campgrounds}">
          <td th:text="${campground.name}">캠핑장 이름</td>
          <td th:text="${campground.address}">캠핑장 주소</td>
          <td th:text="${campground.phone}">캠핑장 전화번호</td>
          <td th:text="${campground.email}">캠핑장 이메일</td>
        </tr>
      </table>
      <hr>
      <h2>캠핑장 등록</h2>
      <form>  <!-- TODO 캠핑장 테이블로 보내는 action 속성 추가 -->
        <div class="form-group">
          <label for="campground-name">캠핑장 이름</label>
          <input type="text" id="campground-name" class="form-control" placeholder="캠핑장 이름을 입력하세요.">
        </div>
        <div class="form-group">
          <label for="campground-address">캠핑장 주소</label>
          <input type="text" id="campground-address" class="form-control" placeholder="캠핑장 주소를 입력하세요.">
        </div>
        <div class="form-group">
          <label for="campground-phone">캠핑장 전화번호</label>
          <input type="tel" id="campground-phone" class="form-control" placeholder="캠핑장 전화번호를 입력하세요.">
        </div>
        <div class="form-group">
          <label for="campground-email">캠핑장 이메일</label>
          <input type="email" id="campground-email" class="form-control" placeholder="캠핑장 이메일을 입력하세요.">
        </div>
        <div class="form-group">
          <label for="campground-info">캠핑장 정보</label>
          <textarea id="campground-info" class="form-control" placeholder="캠핑장 정보를 입력하세요."></textarea>
        </div>
        <button type="submit" class="btn">등록</button>
      </form>
      <hr>
      <h2>캠핑장 삭제</h2>
      <form>  <!-- TODO 캠핑장 삭제 action 속성 추가 -->
        <div class="form-group">
          <label for="campground-name">캠핑장 이름</label>
          <input type="text" id="campground-name" class="form-control" placeholder="삭제할 캠핑장 이름을 입력하세요.">
        </div>
        <button type="submit" class="btn">삭제</button>
      </form>
    </div>
  </div>
</body>
</html>
