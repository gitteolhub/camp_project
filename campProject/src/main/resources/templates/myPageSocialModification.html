<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <th:block th:replace="layout/header :: header-head"></th:block>
  <title>마이페이지 소셜회원정보 조회</title>
  
  <style>
    /* 레이아웃을 위한 스타일 */
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
    }
    .container {
      width: 80%;
      margin: 0 auto;
      padding: 20px;
      background-color: #f9f9f9;
      border: 1px solid #ddd;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }
    .left-menu {
      float: left;
      width: 20%;
      padding: 20px;
      background-color: #f9f9f9;
      border: 1px solid #ddd;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      margin-right: 20px;
    }
    .left-menu ul {
      list-style: none;
      margin: 0;
      padding: 0;
    }
    .left-menu li {
      margin-bottom: 10px;
    }
    .left-menu a {
      text-decoration: none;
      color: #337ab7;
    }
    .left-menu a:hover {
      color: #23527c;  /* 마우스 올렸을 때 색상 변경 */
    }
    .content {
      float: left;
      width: 60%;
      padding: 20px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    .form-group label {
      display: block;
      margin-bottom: 10px;
    }
    .form-control {
      width: 100%;
      height: 40px;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }
    .btn {
      width: 100%;
      height: 40px;
      padding: 10px;
      background-color: #337ab7;
      color: #fff;
      border: none;
      border-radius: 5px;
      cursor: pointer;  /* 버튼에 마우스 올리면 손가락모양 포인터로 변경 */
      margin-top: 2.5px;
      margin-bottom: 2.5px;
    }
    .btn:hover {
      background-color: #23527c;  /* 버튼에 마우스 올렸을 때 버튼색 변경 */
    }
  </style>

  <script>
  //"회원정보 수정 메시지"
  let msg = '[[${msg}]]';
  if(msg.trim() != '') {
	  alert(msg);
  }
  </script>

  <script src="http://dmaps.daum.net/map_js_init/postcode.v2.js"></script>
  
  <script>
	// 주소 검색
	function getPostcodeAddress() {
  	new daum.Postcode({
    	oncomplete: function(data) {
      	// 선택한 주소 정보를 각 필드에 입력
      	var roadAddress = data.roadAddress; // 도로명 주소
      	var jibunAddress = data.jibunAddress; // 지번 주소
      	var zipcode = data.zonecode; // 우편번호

      	// 도로명 주소, 지번 주소, 우편번호 필드에 값 삽입
      	document.getElementById('zip').value = zipcode;
      	document.getElementById('roadAddress').value = roadAddress;
      	document.getElementById('jibunAddress').value = jibunAddress;
    	}
  	}).open(); // 주소 검색창 열기
	}
	
	window.onload=()=>{
		let deleteBtn = document.getElementById('deleteBtn');
		deleteBtn.onclick=(e)=>{
			location.href=`/campProject/deleteSocialMember?id=${e.target.title}`;
		}
	}
  </script>
</head>
<body>

<!-- 헤더 포함 -->
  <th:block th:include="layout/header :: header"></th:block>

  <div class="container">
<!--   authentication:[[${#authentication}]] <br>
  socialUser:[[${session.socialUser}]] -->
    <div class="left-menu">
      <ul>
          <li sec:authorize="hasAnyRole('ROLE_USER', 'ROLE_CEO', 'ROLE_ADMIN')"><a th:href="@{/myPageModification}">회원정보 조회</a></li>
	      <li sec:authorize="hasRole('ROLE_USER')"><a th:href="@{/myPageReservationCheck}">예약 확인</a></li>
	      <li sec:authorize="hasRole('ROLE_CEO')"><a th:href="@{/campGroundManagement}">캠핑장 관리</a></li>
	      <li sec:authorize="hasRole('ROLE_ADMIN')"><a th:href="@{/userManagement}">유저 관리</a></li>
      </ul>
    </div>
	  <div class="content">
		  <h2>회원정보 조회</h2>
		
		  <div class="form-group">
		    <label for="name">이름</label>
		    <span id="name" th:text="${socialUser.name}" class="form-control"></span>
		  </div>
		
		  <div class="form-group">
		    <label for="email">이메일</label>
		    <span id="email" th:text="*{socialUser.email}" class="form-control"></span>
		  </div>
		
		  <div class="form-group">
		    <label for="gender">성별</label>
		    <span id="gender" th:text="${socialUser.gender=='M' ? '남자' : '여자'}" class="form-control"></span>
		  </div>
		
		  <div class="form-group">
		    <label for="birthday">생년월일</label>
		    <span id="birthday" th:text="${socialUser.birthday}" class="form-control"></span>
		  </div>
		
		  <div class="form-group">
		    <label for="mobile">휴대폰 번호</label>
		    <span id="mobile" th:text="${socialUser.mobile}" class="form-control"></span>
		  </div>
		
		  <div class="form-group">
		    <label for="createdDate">가입일</label>
		    <span id="createdDate" th:text="${socialUser.createdDate}" class="form-control"></span>
		  </div>
		
		  <div class="form-group">
		    <button type="button" class="btn" id="deleteBtn" th:title="${socialUser.id}">회원탈퇴</button>
		  </div>
	  </div>
  </div>
</body>
</html>
