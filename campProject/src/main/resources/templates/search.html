    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>캠핑 검색</title>
    <script th:src="@{'/axios/1.7.4/dist/axios.min.js'}"></script>

<body>

     <div class="container">
        <h1>캠핑장 검색</h1>
        <form id="searchForm">
		    <label for="campName"></label>
		    <input type="text" id="campName" name="campName" placeholder="캠핑장 이름을 입력하세요" required>
		    
		    <button type="submit">검색</button>
		</form>
		
		   <!-- 버튼 영역 -->
        <div class="button-container">
        	page입력<input type="number" id="page" name="page"/>
        
		    <a href="javascript:void(0);" id="searchCamping">
		        <img th:src="@{/img/camp.png}" alt="일반야영장" style="width: 100px; height: auto;">
		    </a>
		    
		    <a href="javascript:void(0);" id="searchGlamping">
		        <img th:src="@{/img/glamping.png}" alt="글램핑" style="width: 100px; height: auto;">
		    </a>
		    
		    <a href="javascript:void(0);" id="searchCaraban">
		        <img th:src="@{/img/caraban.png}" alt="카라반" style="width: 100px; height: auto;">
		    </a>
		    
		    <a href="javascript:void(0);" id="searchCar">
		        <img th:src="@{/img/car.png}" alt="자동차야영장" style="width: 100px; height: auto;">
		    </a>
		</div>

        <div id="results">
            <!-- 검색 결과가 이곳에 표시됩니다 -->
        </div>
        
         <script th:src="@{'/js/searchCamp.js'}" charset="UTF-8"></script>
         
    </div>
