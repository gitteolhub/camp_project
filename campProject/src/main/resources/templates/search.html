<!DOCTYPE html>
<html 	xmlns:th="http://www.thymeleaf.org"
		lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>캠핑 검색</title>
    <script th:src="@{'/axios/1.7.4/dist/axios.min.js'}"></script>
    <script th:src="@{'/js/campSearch.js'}" charset="UTF-8"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            width: 80%;
            max-width: 600px;
            padding: 20px;
            background-color: #ffffff;
            border-radius: 8px;
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
        }

        .search-box {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
        }

        .search-box input[type="text"] {
            width: 80%;
            padding: 10px;
            border-radius: 4px;
            border: 1px solid #ccc;
            font-size: 16px;
        }

        .search-box button {
            padding: 10px 15px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
        }

        .search-box button:hover {
            background-color: #45a049;
        }

        .results {
            margin-top: 20px;
        }

        .result-item {
            background-color: #f9f9f9;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 6px;
            box-shadow: 0px 2px 5px rgba(0, 0, 0, 0.1);
        }

        .result-item h3 {
            margin-top: 0;
            font-size: 18px;
        }

        .result-item p {
            font-size: 14px;
            color: #555;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>캠핑지 검색</h1>
        <div class="search-box">
            <input type="text" id="keyword" placeholder="캠핑지 검색어를 입력하세요">
            <button onclick="searchCamping()">검색</button>
        </div>
        <div class="results" id="results"></div>
    </div>

</body>
</html>
