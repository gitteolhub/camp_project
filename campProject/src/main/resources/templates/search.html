<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	  lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>장소 검색</title>
    <script type="text/javascript" src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=c46066f99e17bf65100f3e08a8a562b1&libraries=services"></script>
    <style>
        #map {
            width: 100%;
            height: 400px;
        }
        .search-form {
            text-align: center;
            margin-bottom: 20px;
        }
        .search-form input, .search-form button {
            padding: 10px;
            font-size: 16px;
            margin: 5px;
        }
    </style>
</head>
<body>
    <div class="search-form">
        <input type="text" id="searchKeyword" placeholder="장소를 입력하세요">
        <button onclick="searchPlace()">검색</button>
    </div>

    <div id="map"></div>

    <script>
        var map; // 카카오 맵 객체

        // 지도 생성
        function createMap() {
            var container = document.getElementById('map'); // 지도를 표시할 div
            var options = {
                center: new kakao.maps.LatLng(33.450701, 126.570667), // 초기 지도 중심
                level: 3 // 확대 수준
            };
            map = new kakao.maps.Map(container, options);
        }

        // 장소 검색
        function searchPlace() {
            var keyword = document.getElementById('searchKeyword').value;
            if (!keyword) {
                alert('검색어를 입력하세요!');
                return;
            }

            var ps = new kakao.maps.services.Places(); // 장소 검색 객체
            ps.keywordSearch(keyword, placesSearchCB); // 키워드로 장소 검색
        }

        // 검색 결과 콜백 함수
        function placesSearchCB(data, status, pagination) {
            if (status === kakao.maps.services.Status.OK) {
                // 검색 결과로 지도에 마커 표시
                var bounds = new kakao.maps.LatLngBounds(); // 지도 영역 설정
                for (var i = 0; i < data.length; i++) {
                    var place = data[i];
                    var position = new kakao.maps.LatLng(place.y, place.x);

                    // 마커 생성
                    var marker = new kakao.maps.Marker({
                        position: position,
                        map: map
                    });

                    // 마커 클릭 시 장소 정보 표시
                    var infowindow = new kakao.maps.InfoWindow({
                        content: `<div><strong>${place.place_name}</strong><br>${place.address_name}</div>`
                    });
                    kakao.maps.event.addListener(marker, 'click', function () {
                        infowindow.open(map, marker);
                    });

                    bounds.extend(position); // 지도 영역 확장
                }
                map.setBounds(bounds); // 지도에 맞게 영역 조정
            } else {
                alert('검색 결과가 없습니다.');
            }
        }

        // 페이지 로딩 시 지도 생성
        window.onload = createMap;
    </script>
</body>
</html>
