<!DOCTYPE html>
<html 	xmlns:th="http://www.thymeleaf.org"
		lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>캠핑 검색</title>
    <script th:src="@{'/axios/1.7.4/dist/axios.min.js'}"></script>
    
    <style>
        body {
		    font-family: Arial, sans-serif;
		    background-color: #f4f4f4;
		    margin: 0;
		    padding: 0;
		}
		
		.container {
		    width: 80%;
		    max-width: 1000px;
		    margin: 50px auto;
		    background-color: white;
		    padding: 20px;
		    border-radius: 10px;
		    box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
		}
		
		h1 {
		    text-align: center;
		}
		
		form {
		    display: flex;
		    flex-direction: column;
		    align-items: center;
		    margin-bottom: 20px;
		}
		
		label {
		    margin-bottom: 10px;
		    font-size: 16px;
		}
		
		input[type="text"] {
		    padding: 10px;
		    width: 80%;
		    font-size: 16px;
		    margin-bottom: 10px;
		    border: 1px solid #ccc;
		    border-radius: 5px;
		}
		
		button {
		    padding: 10px 20px;
		    background-color: #4CAF50;
		    color: white;
		    border: none;
		    border-radius: 5px;
		    cursor: pointer;
		}
		
		button:hover {
		    background-color: #45a049;
		}
		
		
    </style>
</head>
<body>

     <div class="container">
        <h1>캠핑장 검색</h1>
        <form id="searchForm">
		    <label for="campName">캠핑장 이름:</label>
		    <input type="text" id="campName" name="campName" placeholder="캠핑장 이름을 입력하세요" required>
		    <button type="submit">검색</button>
		</form>


        <div id="results">
            <!-- 검색 결과가 이곳에 표시됩니다 -->
        </div>
         <script th:src="@{'/js/searchCamp.js'}" charset="UTF-8"></script>
    </div>
   

</body>
</html>
