<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <th:block th:replace="layout/header :: header-head"></th:block>
  <title>마이페이지 회원정보 수정</title>
  
  <style>
    /* 레이아웃을 위한 스타일 */
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
    }
    .container {
      width: 80%;
      margin: 0 auto;
      padding: 20px;
      background-color: #f9f9f9;
      border: 1px solid #ddd;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }
    .left-menu {
      float: left;
      width: 20%;
      padding: 20px;
      background-color: #f9f9f9;
      border: 1px solid #ddd;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      margin-right: 20px;
    }
    .left-menu ul {
      list-style: none;
      margin: 0;
      padding: 0;
    }
    .left-menu li {
      margin-bottom: 10px;
    }
    .left-menu a {
      text-decoration: none;
      color: #337ab7;
    }
    .left-menu a:hover {
      color: #23527c;  /* 마우스 올렸을 때 색상 변경 */
    }
    .content {
      float: left;
      width: 60%;
      padding: 20px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    .form-group label {
      display: block;
      margin-bottom: 10px;
    }
    .form-control {
      width: 100%;
      height: 40px;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }
    .btn {
      width: 100%;
      height: 40px;
      padding: 10px;
      background-color: #337ab7;
      color: #fff;
      border: none;
      border-radius: 5px;
      cursor: pointer;  /* 버튼에 마우스 올리면 손가락모양 포인터로 변경 */
      margin-top: 2.5px;
      margin-bottom: 2.5px;
    }
    .btn:hover {
      background-color: #23527c;  /* 버튼에 마우스 올렸을 때 버튼색 변경 */
    }
  </style>

  <script>
  //"회원정보 수정 메시지"
  let msg = '[[${msg}]]';
  if(msg.trim() != '') {
	  alert(msg);
  }
  </script>

  <script src="http://dmaps.daum.net/map_js_init/postcode.v2.js"></script>
  
  <script>
	// 주소 검색
	function getPostcodeAddress() {
  	new daum.Postcode({
    	oncomplete: function(data) {
      	// 선택한 주소 정보를 각 필드에 입력
      	var roadAddress = data.roadAddress; // 도로명 주소
      	var jibunAddress = data.jibunAddress; // 지번 주소
      	var zipcode = data.zonecode; // 우편번호

      	// 도로명 주소, 지번 주소, 우편번호 필드에 값 삽입
      	document.getElementById('zip').value = zipcode;
      	document.getElementById('roadaddress').value = roadAddress;
      	document.getElementById('jibunAddress').value = jibunAddress;
    	}
  	}).open(); // 주소 검색창 열기
	}
  </script>
</head>
<body>

<!-- 헤더 포함 -->
  <th:block th:include="layout/header :: header"></th:block>

  <div class="container">
    <div class="left-menu">
      <ul>
        <li sec:authorize="hasAnyRole('ROLE_USER', 'ROLE_CEO', 'ROLE_ADMIN')"><a href="http://localhost:8181/campProject/myPageModification">회원정보 수정</a></li>
	      <li sec:authorize="hasRole('ROLE_USER')"><a href="http://localhost:8181/campProject/myPageReservationCheck">예약 확인</a></li>
	      <li sec:authorize="hasRole('ROLE_CEO')"><a href="http://localhost:8181/campProject/campGroundManagement">캠핑장 관리</a></li>
	      <li sec:authorize="hasRole('ROLE_ADMIN')"><a href="http://localhost:8181/campProject/userManagement">유저 관리</a></li>
      </ul>
    </div>
    <div class="content">
      <h2>회원정보 수정</h2>
      <form th:action="@{'/member/updateProc'}" method="post" th:object="${memberUpdateDTO}">  <!-- TODO 회원정보 테이블로 보내는 action 속성 추가 -->
        
        <!-- 히든 필드 -->
        <input type="hidden" th:field="*{id}">
        <input type="hidden" th:field="*{name}">
        <input type="hidden" th:field="*{gender}">
        <input type="hidden" th:field="*{birthday}">
        <input type="hidden" th:field="*{joindate}">
        
        <div class="form-group">
          <label for="email">이메일</label>
          <input type="email" id="email" th:field="*{email}" class="form-control" placeholder="기존 이메일 주소 표시">
        </div>
        <div class="form-group">
          <label for="phone">휴대폰 번호</label>
          <input type="tel" id="phone" th:field="*{phone}" class="form-control" placeholder="기존 휴대폰 번호 표시">
        </div>
        <div class="form-group">
  		  <label for="zip">우편번호</label>
  		  <input type="text" id="zip" th:field="*{zip}" class="form-control" placeholder="기존 우편번호 표시" readonly>
  		  <button type="button" class="btn btn-primary me-2" id="address_search_btn" onclick="getPostcodeAddress()" th:field="*{zip}">주소 검색</button>
		</div>
        <div class="form-group">
  		  <label for="roadAddress">도로명 주소</label>
  		  <input type="text" id="roadAddress" th:field="*{roadAddress}" class="form-control" placeholder="기존 도로명 주소 표시" readonly>
		</div>
		<div class="form-group">
  		  <label for="jibunAddress">지번 주소</label>
  		  <input type="text" id="jibunAddress" th:field="*{jibunAddress}" class="form-control" placeholder="기존 지번 주소 표시" readonly>
		</div>
		<div class="form-group">
  		  <label for="detailAddress">상세 주소</label>
  		  <input type="text" id="detailAddress" th:field="*{detailAddress}" class="form-control" placeholder="기존 상세 주소 표시">
		</div>

<!-- 다른 기능 우선 구현 후 비밀번호 재확인 기능 추가 -->		
<!-- 		<div class="form-group">
  		  <label for="old-password">기존 비밀번호</label>
		  <input type="password" id="pw" th:field="*{pw}" class="form-control" placeholder="기존 비밀번호를 입력하세요.">
		</div> -->

        <div class="form-group">
          <label for="new-password">수정할 비밀번호</label>
          <input type="password" id="passwordUpdate" th:field="*{passwordUpdate}" class="form-control" placeholder="수정할 비밀번호를 입력하세요.">
        </div>
        <button type="submit" class="btn">수정</button>
        <button type="button" class="btn">회원탈퇴</button>
      </form>
    </div>
  </div>
</body>
</html>
