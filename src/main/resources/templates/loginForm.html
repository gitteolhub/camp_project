<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="kr-ko">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <script>
        function showCaptcha() {
            document.getElementById("captchaPopup").style.display = "block";
        }

        function hideCaptcha() {
            document.getElementById("captchaPopup").style.display = "none";
        }

    	 // 로그인 시도 시 로그인 에러 카운트 출력
        function logErrorCount() {
            console.log("session.loginErrorCount:", [[${session.loginErrorCount}]]);
        }
    </script>
    <style>


        body {
            
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .login-container {
            background-color: white;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            width: 300px;
        }

        h2 {
            text-align: center;
            color: #333;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #555;
        }

        input[type="text"], input[type="password"] {
            width: 90%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        /* 로그인 버튼 스타일 */
        .btn-login {
            display: inline-block;
            width: 97%; /* 전체 너비 */
            padding: 10px;
            background-color: #808080;
            border: none;
            border-radius: 4px;
            color: white;
            text-align: center;
            font-size: 14px;
            text-decoration: none; /* 링크의 밑줄 제거 */
            cursor: pointer; /* 커서를 손 모양으로 변경 */
            margin-bottom: 10px; /* 아래쪽 여백 */
        }

        .btn-login:hover {
            background-color: #696969; /* 호버 시 색상 변경 */
        }

		/* 회원가입 버튼 스타일 */
        .btn-join {
            display: inline-block;
            width: 90%; /* 전체 너비 */
            padding: 10px;
            background-color: #008CBA;
            border: none;
            border-radius: 4px;
            color: white;
            text-align: center;
            font-size: 14px;
            text-decoration: none; /* 링크의 밑줄 제거 */
            cursor: pointer; /* 커서를 손 모양으로 변경 */
        }

        .btn-join:hover {
            background-color: #007bb5; /* 호버 시 색상 변경 */
        }

        .error-message {
            color: red;
            text-align: center;
        }

        .social-login {
            text-align: center;
            margin-top: 15px;
        }

        .social-login img {
            width: 100%; /* 버튼 이미지의 너비를 100%로 설정 */
            max-width: 150px; /* 최대 너비를 설정하여 크기를 조정 */
            cursor: pointer; /* 마우스 포인터가 올라갔을 때 손 모양으로 변경 */
            margin: 5px; /* 버튼 사이의 간격 */
        }
        .link-container {
            margin-top: 5px; /* 위쪽 여백 */
            margin-bottom: 5px;
        }

        .link-container a {
            color: #008CBA; /* 링크 색상 */
            text-decoration: none; /* 기본 링크 밑줄 제거 */
            font-size: 10px; /* 글자 크기 조정 */
        }

        .link-container a:hover {
            text-decoration: underline; /* 호버 시 밑줄 */
        }
    </style>
    <script src="https://apis.google.com/js/platform.js?onload=renderButton" async defer></script>
</head>
<body>
    <div class="login-container">
	loginErrorCount:[[${session.loginErrorCount}]] <br>
        <h2>Login Page</h2>
        <!-- TODO 나중에 수정해야함!! action=""부분  -->
        <form action="" method="post">
            <div class="form-group">
                <label for="userid">ID:</label>
                <input type="text"
					   class="form-control ms-0"
					   id="userid"
					   name="userid"
					   required
					   pattern="[a-zA-Z]{1}\w{7,19}"
					   title="아이디는 영문자로 시작하여 8~20자 사이로 작성하여 주십시오" />
            </div>

            <div class="form-group">
                <label for="password">Password:</label>
                <input type="text"
					   class="form-control"
					   id="password"
					   name="password"
					   required
					   pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z])(?=.*\W).{8,20}"
					   title="비밀번호는 영문 대소문자 및 숫자, 특수문자를 최소 1개 이상 포함하여 8~20 사이로 작성하여 주십시오." />
            </div>

			 <!-- 아이디 찾기 및 비밀번호 찾기 링크 추가 -->
	        <div class="link-container">
	            <a th:href="@{/findUserId}">아이디 찾기 |</a>
	            <a th:href="@{/findUserPw}">비밀번호 찾기</a>
	        </div>

            <div class="form-group">
			    <div class="d-flex justify-content-evenly">
			        <input type="submit"
			               class="btn-login"
			               id="login"
			               name="login"
			               value="로그인" />
			        <a th:href="@{/join}" class="btn-join">회원가입</a>
			    </div>
			</div>

            <div class="error-message" th:if="${error!=null}">
            <script>
              alert('아이디와 비밀번호를 확인하세요.');
            </script>
            </div>
        </form>



        <!-- 소셜 로그인 버튼 추가 -->
        <div class="social-login" sec:authorize="isAnonymous()">
            <a th:href="@{'/oauth2/authorization/naver'}">
            	<img th:src="@{/social_login_img/btnG_완성형.png}" alt="Naver Login" />
            </a>
            <a th:href="@{'/oauth2/authorization/google'}">
				<img th:src="@{/social_login_img/android_light_sq_SI@3x.png}" alt="Naver Login" />
			</a>
        </div>
        <!--// 소셜 로그인 버튼 추가 -->
    </div>
</body>
</html>
